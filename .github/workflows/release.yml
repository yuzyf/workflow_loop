# workflow-loop v0.1.0 正式发布任务
# 手动触发只执行：版本身份核对 → 全量测试 → 构建 → 三平台安装验证。
# 标签 v0.1.0 在同一验证通过后才把原样构建包发布到 PyPI，并公开 GitHub Release。
# 任一步失败都不能上传未经验证的包；不保存长期 PyPI 密码或上传令牌。
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.0"

env:
  PRODUCT_VERSION: "0.1.0"

jobs:
  # 版本身份核对 + 全量测试：所有位置都必须严格等于 0.1.0
  verify-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 核对全部版本身份
        run: |
          set -euo pipefail
          fail=0
          grep -q 'version = "0.1.0"' pyproject.toml || { echo "pyproject.toml 版本不是 0.1.0"; fail=1; }
          grep -q '__version__ = "0.1.0"' src/workflow_loop/__init__.py || { echo "__init__.py 版本不是 0.1.0"; fail=1; }
          grep -q 'PRODUCT_VERSION="0.1.0"' install.sh || { echo "install.sh 版本不是 0.1.0"; fail=1; }
          grep -q '\$ProductVersion = "0.1.0"' install.ps1 || { echo "install.ps1 版本不是 0.1.0"; fail=1; }
          grep -q 'SCRIPT_VERSION="0.1.0"' update.sh || { echo "update.sh 版本不是 0.1.0"; fail=1; }
          grep -q '\$ScriptVersion = "0.1.0"' update.ps1 || { echo "update.ps1 版本不是 0.1.0"; fail=1; }
          grep -q 'PRODUCT_VERSION="0.1.0"' uninstall.sh || { echo "uninstall.sh 版本不是 0.1.0"; fail=1; }
          grep -q '\$ProductVersion = "0.1.0"' uninstall.ps1 || { echo "uninstall.ps1 版本不是 0.1.0"; fail=1; }
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            [ "${GITHUB_REF_NAME}" = "v0.1.0" ] || { echo "标签不是 v0.1.0"; fail=1; }
          fi
          exit $fail
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 运行完整测试
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  # 构建 wheel（二进制分发包）和 source distribution（源码分发包）
  build:
    needs: verify-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建分发包
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # PyPI 可信发布：检测到 PyPI 已存在 0.1.0 时只能停止，不能删除、覆盖或重发
  publish-pypi:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    needs: prepublish-smoke
    runs-on: ubuntu-latest
    permissions:
      # PyPI Trusted Publishing（可信发布）使用 OIDC 身份，不保存长期令牌
      id-token: write
    steps:
      - name: 检查 PyPI 是否已存在 0.1.0
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/workflow-loop/${PRODUCT_VERSION}/json")
          if [ "$status" = "200" ]; then
            echo "PyPI 已存在 workflow-loop ${PRODUCT_VERSION}，发布任务停止；不能删除、覆盖或重发。"
            exit 1
          fi
          echo "PyPI 尚无 workflow-loop ${PRODUCT_VERSION}，可以发布。"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 上传到 PyPI（Trusted Publishing）
        uses: pypa/gh-action-pypi-publish@release/v1

  # 发布前三平台冒烟：安装脚本通过 UV_FIND_LINKS 使用本次构建的同一份 0.1.0 包
  prepublish-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 准备发布冒烟固定版本元数据
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          version = os.environ["PRODUCT_VERSION"]
          metadata_root = Path(os.environ["RUNNER_TEMP"]) / "workflow-loop-release-metadata"
          github_root = metadata_root / "github"
          tag_path = github_root / "releases" / "tags" / f"v{version}"
          latest_path = github_root / "releases" / "latest"
          tag_path.parent.mkdir(parents=True, exist_ok=True)

          pypi = {
              "info": {"version": version},
              "releases": {version: [{"yanked": False}]},
          }
          github = {
              "tag_name": f"v{version}",
              "draft": False,
              "prerelease": False,
          }
          pypi_path = metadata_root / "pypi.json"
          pypi_path.write_text(json.dumps(pypi), encoding="utf-8")
          tag_path.write_text(json.dumps(github), encoding="utf-8")
          latest_path.write_text(json.dumps(github), encoding="utf-8")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              stream.write(f"WORKFLOW_LOOP_PYPI_JSON_URL={pypi_path.as_uri()}\n")
              stream.write(f"WORKFLOW_LOOP_GITHUB_API_URL={github_root.as_uri()}\n")
      - name: 安装脚本冒烟：确认、取消与安装（Linux）
        if: runner.os == 'Linux'
        env:
          UV_FIND_LINKS: ${{ github.workspace }}/dist
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/workflow-loop-linux-bin
          UV_TOOL_DIR: ${{ runner.temp }}/workflow-loop-linux-tools
        run: |
          set -euo pipefail
          run_installer() {
            INSTALL_ANSWER="$1" python - <<'PY'
          import os
          import pty

          answer = os.environ["INSTALL_ANSWER"].encode() + b"\n"
          observed = bytearray()
          sent = False

          def read_installer_output(fd):
              global sent
              data = os.read(fd, 1024)
              observed.extend(data)
              if not sent and b"[y/N]" in observed:
                  os.write(fd, answer)
                  sent = True
              if len(observed) > 64:
                  del observed[:-64]
              return data

          status = pty.spawn(
              ["bash", "install.sh"],
              master_read=read_installer_output,
              stdin_read=lambda _fd: b"",
          )
          raise SystemExit(os.waitstatus_to_exitcode(status))
          PY
          }
          proj="$(mktemp -d)"
          cp install.sh "$proj/"
          # 取消路径：输入 n，必须零写入
          (cd "$proj" && run_installer "$(printf 'n\n')")
          [ ! -d "$proj/.workflow_loop" ] || { echo "取消后仍产生写入"; exit 1; }
          # 确认路径：输入 y，必须得到完整骨架
          (cd "$proj" && run_installer "$(printf 'y\n')")
          [ -f "$proj/.workflow_loop/project.json" ] || { echo "安装后缺少项目标记"; exit 1; }
          [ -f "$proj/AGENTS.md" ] || { echo "安装后缺少 AGENTS.md"; exit 1; }
          identity="$("${UV_TOOL_BIN_DIR}/workflow" --version)"
          [ "$identity" = "workflow-loop ${PRODUCT_VERSION}" ] || { echo "身份核对失败：$identity"; exit 1; }
          export PATH="${UV_TOOL_BIN_DIR}:${PATH}"
          # 重复安装路径：两侧均已安装，零修改退出
          repeat_output="$(cd "$proj" && run_installer "$(printf 'y\n')")"
          printf '%s\n' "$repeat_output" | grep -q "当前项目已经安装，未修改任何文件"
          # 只缺项目侧：复用全局命令，为新项目补骨架
          project_only="$(mktemp -d)"
          cp install.sh "$project_only/"
          (cd "$project_only" && run_installer "$(printf 'y\n')")
          [ -f "$project_only/.workflow_loop/project.json" ] || { echo "只缺项目侧时没有补齐骨架"; exit 1; }
          # 只缺电脑侧：删除工具后重装，已存在项目内容不能变化
          cp "$proj/AGENTS.md" "${RUNNER_TEMP}/linux-AGENTS.before"
          rm -rf "${UV_TOOL_DIR}" "${UV_TOOL_BIN_DIR}"
          (cd "$proj" && run_installer "$(printf 'y\n')")
          cmp "$proj/AGENTS.md" "${RUNNER_TEMP}/linux-AGENTS.before"
          python -m pip download --only-binary=:all: packaging -d "${GITHUB_WORKSPACE}/dist"
          python - "$proj/.workflow_loop/project.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as stream:
              value = json.load(stream)
          value["installer_version"] = "0.0.9"
          value["topic_history"] = ["release-smoke-sentinel"]
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(value, stream, ensure_ascii=False)
          PY
          printf 'business-sentinel' > "$proj/business.txt"
          rm -rf "${UV_TOOL_DIR}" "${UV_TOOL_BIN_DIR}"
          (cd "$proj" && UV_NO_INDEX=1 bash "${GITHUB_WORKSPACE}/update.sh" --version "${PRODUCT_VERSION}" --confirmed)
          grep -q '"installer_version": "0.1.0"' "$proj/.workflow_loop/project.json"
          [ "$(cat "$proj/business.txt")" = "business-sentinel" ]
          (cd "$proj" && UV_NO_INDEX=1 bash "${GITHUB_WORKSPACE}/uninstall.sh" --confirmed)
          [ ! -e "$proj/.workflow_loop" ]
          [ "$(cat "$proj/business.txt")" = "business-sentinel" ]
          (cd "${RUNNER_TEMP}" && UV_NO_INDEX=1 bash "${GITHUB_WORKSPACE}/uninstall.sh" --global --confirmed)
          [ ! -e "${UV_TOOL_BIN_DIR}/workflow" ]
      - name: 安装脚本冒烟：确认、取消与安装（macOS）
        if: runner.os == 'macOS'
        env:
          UV_FIND_LINKS: ${{ github.workspace }}/dist
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/workflow-loop-macos-bin
          UV_TOOL_DIR: ${{ runner.temp }}/workflow-loop-macos-tools
        run: |
          set -euo pipefail
          run_installer() {
            INSTALL_ANSWER="$1" python - <<'PY'
          import os
          import pty

          answer = os.environ["INSTALL_ANSWER"].encode() + b"\n"
          observed = bytearray()
          sent = False

          def read_installer_output(fd):
              global sent
              data = os.read(fd, 1024)
              observed.extend(data)
              if not sent and b"[y/N]" in observed:
                  os.write(fd, answer)
                  sent = True
              if len(observed) > 64:
                  del observed[:-64]
              return data

          status = pty.spawn(
              ["bash", "install.sh"],
              master_read=read_installer_output,
              stdin_read=lambda _fd: b"",
          )
          raise SystemExit(os.waitstatus_to_exitcode(status))
          PY
          }
          proj="$(mktemp -d)"
          cp install.sh "$proj/"
          (cd "$proj" && run_installer "$(printf 'n\n')")
          [ ! -d "$proj/.workflow_loop" ] || { echo "取消后仍产生写入"; exit 1; }
          (cd "$proj" && run_installer "$(printf 'y\n')")
          [ -f "$proj/.workflow_loop/project.json" ] || { echo "安装后缺少项目标记"; exit 1; }
          [ -f "$proj/AGENTS.md" ] || { echo "安装后缺少 AGENTS.md"; exit 1; }
          identity="$("${UV_TOOL_BIN_DIR}/workflow" --version)"
          [ "$identity" = "workflow-loop ${PRODUCT_VERSION}" ] || { echo "身份核对失败：$identity"; exit 1; }
          export PATH="${UV_TOOL_BIN_DIR}:${PATH}"
          repeat_output="$(cd "$proj" && run_installer "$(printf 'y\n')")"
          printf '%s\n' "$repeat_output" | grep -q "当前项目已经安装，未修改任何文件"
          project_only="$(mktemp -d)"
          cp install.sh "$project_only/"
          (cd "$project_only" && run_installer "$(printf 'y\n')")
          [ -f "$project_only/.workflow_loop/project.json" ] || { echo "只缺项目侧时没有补齐骨架"; exit 1; }
          cp "$proj/AGENTS.md" "${RUNNER_TEMP}/macos-AGENTS.before"
          rm -rf "${UV_TOOL_DIR}" "${UV_TOOL_BIN_DIR}"
          (cd "$proj" && run_installer "$(printf 'y\n')")
          cmp "$proj/AGENTS.md" "${RUNNER_TEMP}/macos-AGENTS.before"
          python -m pip download --only-binary=:all: packaging -d "${GITHUB_WORKSPACE}/dist"
          python - "$proj/.workflow_loop/project.json" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as stream:
              value = json.load(stream)
          value["installer_version"] = "0.0.9"
          value["topic_history"] = ["release-smoke-sentinel"]
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(value, stream, ensure_ascii=False)
          PY
          printf 'business-sentinel' > "$proj/business.txt"
          rm -rf "${UV_TOOL_DIR}" "${UV_TOOL_BIN_DIR}"
          (cd "$proj" && UV_NO_INDEX=1 bash "${GITHUB_WORKSPACE}/update.sh" --version "${PRODUCT_VERSION}" --confirmed)
          grep -q '"installer_version": "0.1.0"' "$proj/.workflow_loop/project.json"
          [ "$(cat "$proj/business.txt")" = "business-sentinel" ]
          (cd "$proj" && UV_NO_INDEX=1 bash "${GITHUB_WORKSPACE}/uninstall.sh" --confirmed)
          [ ! -e "$proj/.workflow_loop" ]
          [ "$(cat "$proj/business.txt")" = "business-sentinel" ]
          (cd "${RUNNER_TEMP}" && UV_NO_INDEX=1 bash "${GITHUB_WORKSPACE}/uninstall.sh" --global --confirmed)
          [ ! -e "${UV_TOOL_BIN_DIR}/workflow" ]
      - name: 安装脚本冒烟：PowerShell 7（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_FIND_LINKS: ${{ github.workspace }}\dist
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\workflow-loop-pwsh-bin
          UV_TOOL_DIR: ${{ runner.temp }}\workflow-loop-pwsh-tools
        run: |
          $proj = Join-Path $env:RUNNER_TEMP "smoke_pwsh"
          New-Item -ItemType Directory -Path $proj | Out-Null
          Copy-Item install.ps1 $proj
          Push-Location $proj
          "n" | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if (Test-Path ".workflow_loop") { Write-Error "取消后仍产生写入"; exit 1 }
          "y" | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if (-not (Test-Path ".workflow_loop/project.json")) { Write-Error "安装后缺少项目标记"; exit 1 }
          if (-not (Test-Path "AGENTS.md")) { Write-Error "安装后缺少 AGENTS.md"; exit 1 }
          $workflow = Join-Path $env:UV_TOOL_BIN_DIR "workflow.exe"
          $identity = (& $workflow --version | Out-String).Trim()
          if ($identity -ne "workflow-loop $env:PRODUCT_VERSION") { Write-Error "身份核对失败：$identity"; exit 1 }
          $env:Path = "$env:UV_TOOL_BIN_DIR;$env:Path"
          $repeat = ("y" | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1 | Out-String)
          if ($repeat -notmatch "当前项目已经安装，未修改任何文件") { Write-Error "完整重复安装没有零修改退出"; exit 1 }
          Pop-Location
          $projectOnly = Join-Path $env:RUNNER_TEMP "smoke_pwsh_project_only"
          New-Item -ItemType Directory -Path $projectOnly | Out-Null
          Copy-Item install.ps1 $projectOnly
          Push-Location $projectOnly
          "y" | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if (-not (Test-Path ".workflow_loop/project.json")) { Write-Error "只缺项目侧时没有补齐骨架"; exit 1 }
          Pop-Location
          $before = (Get-FileHash (Join-Path $proj "AGENTS.md") -Algorithm SHA256).Hash
          Remove-Item -Recurse -Force $env:UV_TOOL_DIR, $env:UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
          Push-Location $proj
          "y" | pwsh -NoProfile -ExecutionPolicy Bypass -File install.ps1
          $after = (Get-FileHash "AGENTS.md" -Algorithm SHA256).Hash
          if ($after -ne $before) { Write-Error "只缺电脑侧时改写了现有项目内容"; exit 1 }
          Pop-Location
          python -m pip download --only-binary=:all: packaging -d "$env:GITHUB_WORKSPACE\dist"
          $marker = Join-Path $proj ".workflow_loop\project.json"
          $value = Get-Content -Raw $marker | ConvertFrom-Json
          $value.installer_version = "0.0.9"
          $value.topic_history = @("release-smoke-sentinel")
          [System.IO.File]::WriteAllText($marker, ($value | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::WriteAllText((Join-Path $proj "business.txt"), "business-sentinel")
          Remove-Item -Recurse -Force $env:UV_TOOL_DIR, $env:UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
          $env:UV_NO_INDEX = "1"
          Push-Location $proj
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\update.ps1" -TargetVersion $env:PRODUCT_VERSION -Confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $updated = Get-Content -Raw ".workflow_loop\project.json" | ConvertFrom-Json
          if ($updated.installer_version -ne $env:PRODUCT_VERSION) { Write-Error "项目版本没有更新"; exit 1 }
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\uninstall.ps1" -Confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path ".workflow_loop") { Write-Error "项目管理目录没有删除"; exit 1 }
          if ((Get-Content -Raw "business.txt") -ne "business-sentinel") { Write-Error "业务文件发生变化"; exit 1 }
          Pop-Location
          Push-Location $env:RUNNER_TEMP
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\uninstall.ps1" -Global -Confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: 安装脚本冒烟：Windows PowerShell 5.1（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_FIND_LINKS: ${{ github.workspace }}\dist
          UV_TOOL_BIN_DIR: ${{ runner.temp }}\workflow-loop-ps51-bin
          UV_TOOL_DIR: ${{ runner.temp }}\workflow-loop-ps51-tools
        run: |
          $env:Path = (($env:Path -split ";" | Where-Object { $_ -notlike "$env:RUNNER_TEMP\workflow-loop-*" }) -join ";")
          $proj = Join-Path $env:RUNNER_TEMP "smoke_ps51"
          New-Item -ItemType Directory -Path $proj | Out-Null
          Copy-Item install.ps1 $proj
          Push-Location $proj
          "n" | powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if (Test-Path ".workflow_loop") { Write-Error "取消后仍产生写入"; exit 1 }
          "y" | powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1
          if (-not (Test-Path ".workflow_loop/project.json")) { Write-Error "安装后缺少项目标记"; exit 1 }
          $workflow = Join-Path $env:UV_TOOL_BIN_DIR "workflow.exe"
          $identity = (& $workflow --version | Out-String).Trim()
          if ($identity -ne "workflow-loop $env:PRODUCT_VERSION") { Write-Error "身份核对失败：$identity"; exit 1 }
          $env:Path = "$env:UV_TOOL_BIN_DIR;$env:Path"
          $repeat = ("y" | powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 | Out-String)
          if ($repeat -notmatch "当前项目已经安装，未修改任何文件") { Write-Error "完整重复安装没有零修改退出"; exit 1 }
          Pop-Location
          python -m pip download --only-binary=:all: packaging -d "$env:GITHUB_WORKSPACE\dist"
          $marker = Join-Path $proj ".workflow_loop\project.json"
          $value = Get-Content -Raw $marker | ConvertFrom-Json
          $value.installer_version = "0.0.9"
          $value.topic_history = @("release-smoke-sentinel")
          [System.IO.File]::WriteAllText($marker, ($value | ConvertTo-Json -Depth 10), (New-Object System.Text.UTF8Encoding($false)))
          [System.IO.File]::WriteAllText((Join-Path $proj "business.txt"), "business-sentinel")
          Remove-Item -Recurse -Force $env:UV_TOOL_DIR, $env:UV_TOOL_BIN_DIR -ErrorAction SilentlyContinue
          $env:UV_NO_INDEX = "1"
          Push-Location $proj
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\update.ps1" -TargetVersion $env:PRODUCT_VERSION -Confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $updated = Get-Content -Raw ".workflow_loop\project.json" | ConvertFrom-Json
          if ($updated.installer_version -ne $env:PRODUCT_VERSION) { Write-Error "项目版本没有更新"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\uninstall.ps1" -Confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path ".workflow_loop") { Write-Error "项目管理目录没有删除"; exit 1 }
          if ((Get-Content -Raw "business.txt") -ne "business-sentinel") { Write-Error "业务文件发生变化"; exit 1 }
          Pop-Location
          Push-Location $env:RUNNER_TEMP
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\uninstall.ps1" -Global -Confirmed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

  # 全部通过后才创建带安装、更新和卸载脚本的公开 GitHub Release
  github-release:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.1.0'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 创建 v0.1.0 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Workflow Loop 0.1.0
          body: |
            Workflow Loop 0.1.0 为 AI 驱动的软件开发提供有状态、可验证、可回退的工作流管理。

            - 支持 macOS、Linux 和原生 Windows 使用一条命令完成安装。
            - 支持更新电脑全局命令和当前项目，并分别卸载项目或电脑全局命令。
            - 支持从零创建、修改产品和修复缺陷三种工作意图。
            - 每个正式环节依次经过讨论完成、程序检查和用户确认三道门。
            - 通过需求交付追踪表关联设计、验收、测试和实施结果。
            - 正式测试由程序保存命令、环境、时间、退出码和代码版本等机器执行记录。
            - 支持返回上游修正、本轮修改回退和整轮作废恢复。
            - 运行环境要求 Python 3.11 或更高版本。
          files: |
            install.sh
