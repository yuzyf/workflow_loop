[project]
name = "workflow-loop"
version = "0.3.2"
description = "为 AI 驱动的软件开发提供有状态、可验证、可回退的工作流管理。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuzyf" }]
dependencies = ["markdown-it-py>=4.0", "packaging>=24.0"]

[project.scripts]
workflow = "workflow_loop.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=7.0", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/yuzyf/workflow_loop"
Repository = "https://github.com/yuzyf/workflow_loop"

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workflow_loop = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
]
